<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Page</title>


    <link rel="stylesheet" href="css/form.css">


</head>
<body>
    <form action="">

        <legend><b>Join Us and start your journey today!</b></legend>

        <br>


        <label for="firstname:">First Name :</label>
        <input type="text" placeholder="firstname" id="firstname" required><br><br>


         <label for="secondname:">Second Name :</label>
         <input type="text" placeholder="secondname" id="secondname" required><br><br>

         
          <label for="email">Email :</label>
          <input type="email" placeholder="your email" id="email" required><br><br>


          <label for="number">Phone Number :</label>
          <input type="tel" placeholder="your your phone number" id="number" required><br><br>

          <label for="pwd">Password :</label>
          <input type="password" placeholder="your password" id="pwd" required><br><br>


          <label for="dob">Date of Birth :</label>
          <input type="date" id="dob" required><br><br>


           <label for="dt">Date and Time :</label>
          <input type="datetime-local" id="dt" required><br><br>


           <label for="file">Upload File :</label>
          <input type="file" id="file" required><br><br>

          <!-----Dropdown----->


          <!----Checkbox----->


          <!------Radiobutton--->


          <!---textarea-->




          <button >Register</button>











           












    </form>
  
</body>
</html>
